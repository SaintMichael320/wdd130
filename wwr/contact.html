<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Exciting Expeditions for rafting questions, reservations, and general inquiries. Includes company info, map, employee profiles, and a full contact form.">
    <meta name="author" content="Michael Pienaar">

    <title>Contact Us — Exciting Expeditions</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Exciting Expeditions Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">

        <!-- COMPANY INFO -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-layout">
            <!-- MAP -->
            <div class="map-box">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.118523712345!2d-122.419416!3d37.774929!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c2f2a0001%3A0x0000000000000000!2sFake%20Rafting%20HQ!5e0!3m2!1sen!2sus!4v000000000"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- CONTACT FORM -->
            <form class="contact-form">
                <h2>Contact Form & Map</h2>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Jake Miller" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Miller@gmail.com" required>

                <div class="form-row">
                    <p>Message Purpose</p>
                </div>

                <div class="radio-column">
                    <label class="radio-option">
                        <input type="radio" id="purpose-general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label class="radio-option">
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label class="radio-option">
                        <input type="radio" id="purpose-suggestion" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </div>

                <div class="message-box">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" placeholder="Type here." required></textarea>
                </div>
                <label class="newsletter-check">
                    Please Subscribe me to the monthly newsletter
                    <input type="checkbox" name="subscribe">

                </label>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>

        </section>

        <!-- EMPLOYEES SECTION -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 🌊 Exciting Expeditions 🌊 Michael Pienaar</p>

        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.svg" alt="Visit our Facebook page"></a>
            <a href="#"><img src="images/linkedin.svg" alt="Visit our LinkedIn profile"></a>
            <a href="#"><img src="images/instagram.svg" alt="Visit our Instagram page"></a>
        </nav>
    </footer>

</body>

</html>
